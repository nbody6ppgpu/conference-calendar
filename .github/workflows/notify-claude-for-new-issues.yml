name: Notify Claude for tagged issues

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # A dedicated GitHub App identity (not GITHUB_TOKEN, not a PAT tied to a
      # maintainer's own account) posts this comment. GITHUB_TOKEN-authored
      # comments still notify watchers fine, but every human-visible action in
      # this automation posts under the same identity for consistency, and the
      # App's installation token -- unlike GITHUB_TOKEN -- doesn't hit GitHub's
      # anti-recursion restriction that silently skips workflows triggered by
      # GITHUB_TOKEN-authored events (relevant for the PR-opening steps this
      # identity is shared with; see claude-add-conference.yml).
      - name: Mint calendar-bot installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CALENDAR_BOT_APP_ID }}
          private-key: ${{ secrets.CALENDAR_BOT_APP_PRIVATE_KEY }}

      - name: Comment @claude on matching issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const title = context.payload.issue.title || "";
            const shouldNotify = /\[(new|ai)\]/i.test(title);
            if (!shouldNotify) {
              core.info("Issue title does not match [new]/[ai] tag pattern; skipping.");
              return;
            }

            const body = [
              "@claude",
              "",
              "<!-- claude-automation: add-conference -->",
              "Add this conference to `data/conferences.yml` by following",
              "`AGENTS.md`'s \"Mode 1 — Add a conference from an issue\".",
              "Use this issue's body for the meeting URL and optional comments text.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });

            core.info("Posted @claude comment on issue.");

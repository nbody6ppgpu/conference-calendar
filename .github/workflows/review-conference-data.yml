name: Review conference data

on:
  pull_request:
    paths:
      - data/conferences.yml

permissions:
  contents: read

jobs:
  ask-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Stop for forked pull requests
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "This workflow asks the Copilot coding agent to review conference data only for pull requests from branches in this repository."
          echo "Forked pull requests do not receive the token needed to comment as this repository."
          echo "Please run the conference data reviewer manually and update data/conferences.yml."
          exit 1

      - uses: actions/checkout@v4
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.sender.login != 'Copilot' &&
          github.event.sender.login != 'copilot-swe-agent[bot]'

      - name: Ask Copilot coding agent to review conference data
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.sender.login != 'Copilot' &&
          github.event.sender.login != 'copilot-swe-agent[bot]'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          comment_file="$RUNNER_TEMP/copilot-review-comment.md"
          {
            echo "@copilot"
            echo
            echo "This pull request's base branch is \`${BASE_REF}\`. Wherever the instructions below refer to \`\$REVIEW_BASE_REF\`, use \`origin/${BASE_REF}\` (e.g. \`git diff origin/${BASE_REF}...HEAD -- data/conferences.yml\`)."
            echo
            cat .github/prompts/conference-data-reviewer.md
          } > "$comment_file"
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -F body="@${comment_file}"

  # Copilot's own pushes retrigger this workflow (paths: data/conferences.yml).
  # Skip re-asking it to review its own commit, but do check that it only
  # touched the one file it was told to touch.
  verify-copilot-scope:
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.sender.login == 'Copilot' || github.event.sender.login == 'copilot-swe-agent[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Ensure Copilot only modified data/conferences.yml
        run: |
          set -euo pipefail

          mapfile -t files < <(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}")

          echo "Changed files:"
          printf ' - %s\n' "${files[@]:-}"

          allowed='data/conferences.yml'
          disallowed=()

          for f in "${files[@]:-}"; do
            [[ -z "$f" ]] && continue
            if [[ "$f" != "$allowed" ]]; then
              disallowed+=("$f")
            fi
          done

          if (( ${#disallowed[@]} > 0 )); then
            echo "Copilot modified unexpected files. Only $allowed is expected:"
            printf ' - %s\n' "${disallowed[@]}"
            exit 1
          fi

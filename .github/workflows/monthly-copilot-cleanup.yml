name: Monthly Copilot Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 4 * *"

permissions:
  contents: read
  issues: write

jobs:
  ask-copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create cleanup issue and assign Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/cleanup-issue-body.md"
          {
            echo "Read \`AGENTS.md\` and clean the calendar. Do not run the build script."
            echo
            echo "For any conference entries you change while cleaning, also act as the second-pass reviewer per the instructions below."
            echo
            cat .github/prompts/conference-data-reviewer.md
          } > "$body_file"

          issue_url=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Monthly calendar cleanup" \
            --body-file "$body_file")
          echo "Created $issue_url"

          issue_number="${issue_url##*/}"
          gh api "repos/${{ github.repository }}/issues/${issue_number}/assignees" \
            -f "assignees[]=copilot-swe-agent[bot]"

name: "Claude: add conference from issue"

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write
  issues: write
  # claude-code-action exchanges a GitHub OIDC token for the Claude App
  # installation token. Without id-token: write it fails before doing any
  # work with "Could not fetch an OIDC token".
  id-token: write

jobs:
  add-conference:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '<!-- claude-automation: add-conference -->')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude to add the conference entry
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "claude/issue-${{ github.event.issue.number }}-"
          show_full_output: false
          claude_args: |
            --allowedTools Read,Edit,Bash,WebFetch
            --disallowedTools WebSearch
          prompt: |
            Read `AGENTS.md` and follow "Mode 1 — Add a conference from an
            issue" exactly.

            This is issue #${{ github.event.issue.number }}, titled:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Add one entry to `data/conferences.yml` for the meeting linked in
            this issue, verify the build, and commit your change. Do not open
            a pull request yourself; a separate deterministic step does that.

      - name: Check Claude's run succeeded
        if: steps.claude.outputs.conclusion != 'success'
        run: |
          echo "::error::Claude Code run did not conclude successfully (conclusion=${{ steps.claude.outputs.conclusion }})."
          exit 1

      - name: Open draft PR for the new entry
        if: success() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$CLAUDE_BRANCH" --state open --json url --jq '.[0].url' || true)"
          if [[ -n "$existing" ]]; then
            echo "::error::A pull request already exists for $CLAUDE_BRANCH: $existing"
            exit 1
          fi

          body_file="$RUNNER_TEMP/add-conference-pr.md"
          {
            echo "Fixes #$ISSUE_NUMBER"
            echo
            echo "Adds a conference entry requested in #$ISSUE_NUMBER (\"$ISSUE_TITLE\")."
            echo "Generated by Claude Code from the issue body; please review the"
            echo "extracted dates and links before merging."
          } > "$body_file"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$CLAUDE_BRANCH" \
            --base main \
            --draft \
            --title "Add conference: issue #$ISSUE_NUMBER" \
            --body-file "$body_file"

      # Split from the failure notice below on purpose: a run that fails before
      # Claude pushes anything has an empty branch_name, and gating the whole
      # step on it would leave the issue with no signal at all.
      - name: Clean up orphan branch on failure
        if: failure() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -uo pipefail

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CLAUDE_BRANCH" \
            || echo "::warning::Could not delete branch $CLAUDE_BRANCH (it may not have been pushed)."

      - name: Notify the issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automated attempt to add this conference failed ([run log]($RUN_URL)). A maintainer needs to add it manually, or re-run the automation by posting a comment containing \`<!-- claude-automation: add-conference -->\`."

name: Verify automation scope

on:
  pull_request:
    paths:
      - data/conferences.yml

permissions:
  contents: read

jobs:
  # Claude's own pushes retrigger this workflow (paths: data/conferences.yml).
  # There is no automatic second-pass model review any more — a human
  # approving the PR is the second pass. This job only checks that an
  # automated push touched exactly the file it was told to touch.
  verify-automation-scope:
    runs-on: ubuntu-latest
    # Keyed on the branch namespace rather than on the pushing identity.
    # Identity turned out to be the wrong key: in agent mode the model never
    # pushes at all, so a sender == 'claude[bot]' filter would have no traffic
    # and could not even be exercised by deliberately pushing a bad commit to
    # an automation branch. The branch prefixes are what actually define
    # "this PR is supposed to only touch the data file".
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'claude/') ||
       startsWith(github.event.pull_request.head.ref, 'automation/'))
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Ensure the automated push only modified data/conferences.yml
        run: |
          set -euo pipefail

          mapfile -t files < <(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}")

          echo "Changed files:"
          printf ' - %s\n' "${files[@]:-}"

          allowed='data/conferences.yml'
          disallowed=()

          for f in "${files[@]:-}"; do
            [[ -z "$f" ]] && continue
            if [[ "$f" != "$allowed" ]]; then
              disallowed+=("$f")
            fi
          done

          if (( ${#disallowed[@]} > 0 )); then
            echo "Automated push modified unexpected files. Only $allowed is expected:"
            printf ' - %s\n' "${disallowed[@]}"
            exit 1
          fi
